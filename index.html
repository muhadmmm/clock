<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Hacker Clock — DECAFEMTO-369</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><span class="status-dot"></span> CLOCK // RADAR SYSTEM ONLINE</div><button id="settingsBtn" aria-label="Settings">⚙</button></header>
<main>
<section class="radar-section">
  <div class="radar-title">TIME RADAR <span id="timezone">--</span></div>
  <div class="clock-rack">
    <article class="dial-unit"><div class="dial-heading">H O U R S</div><div class="radar-clock" id="hour-clock"><div class="sweep"></div><div class="radar-grid"></div><div class="radar-hand hour-hand"></div><div class="center-dot"></div><div class="dial-value" id="hourValue">00</div></div></article>
    <article class="dial-unit"><div class="dial-heading">M I N U T E S</div><div class="radar-clock" id="minute-clock"><div class="sweep"></div><div class="radar-grid"></div><div class="radar-hand minute-hand"></div><div class="center-dot"></div><div class="dial-value" id="minuteValue">00</div></div></article>
    <article class="dial-unit"><div class="dial-heading">S E C O N D S</div><div class="radar-clock" id="second-clock"><div class="sweep"></div><div class="radar-grid"></div><div class="radar-hand second-hand"></div><div class="center-dot"></div><div class="dial-value" id="secondValue">00</div></div></article>
  </div>
  <div class="calendar-readout"><span id="date">----</span><span class="weekday" id="weekday">----</span></div>
  <div class="year-label">Y E A R   P R O G R E S S</div><div class="year-bar"><i id="yearProgress"></i></div><div class="year-pct" id="yearPct">0%</div>
</section>
<section class="quote-section"><div class="quote-rule"></div><div class="quote"><span class="quote-mark">“</span><span id="quoteText"></span><span class="cursor">|</span><span class="quote-mark right">”</span></div><div class="signature"><span></span>DECAFEMTO-369<span></span></div></section>
<section class="matrix-section"><div class="matrix-caption">SYSTEM MEMORY // ACTIVE STREAM</div><div class="matrix"><canvas id="matrix"></canvas></div><div class="matrix-footer"><span>DISCIPLINE BUILDS FREEDOM</span><span>KEEP GOING •</span></div></section>
</main>
<footer><span>DECAFEMTO-369</span><span>v2.2 RADAR</span><button id="fullscreenBtn">FULLSCREEN</button></footer>
<div class="modal" id="settings"><div class="modal-box"><button class="close" id="closeSettings">×</button><h2>SETTINGS</h2><label>Matrix intensity <input id="matrixRange" type="range" min="1" max="5" value="3"></label><label>12/24 hour <select id="format"><option value="24">24 HOUR</option><option value="12">12 HOUR</option></select></label><button id="themeBtn">TOGGLE GREEN / AMBER</button></div></div>
<script src="script.js"></script></body></html>
